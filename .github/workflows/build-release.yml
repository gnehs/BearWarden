name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS (Universal)
            os: macos-26
            target: mac
            architecture: --x64 --arm64
            artifact_name: bearwarden-macos
            artifact_path: |
              dist/*.dmg
              dist/*.dmg.blockmap
              dist/*.zip
              dist/*.zip.blockmap
              dist/latest-mac.yml
          - platform: Windows
            os: windows-2025
            target: win
            architecture: --x64
            artifact_name: bearwarden-windows
            artifact_path: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - platform: Linux
            os: ubuntu-24.04
            target: linux
            architecture: --x64
            artifact_name: bearwarden-linux
            artifact_path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.snap
              dist/latest-linux.yml

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1

      - name: Install pnpm
        run: npm install --global pnpm@11.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: pnpm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version

      - name: Build application
        run: pnpm run build
        env:
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Build installer
        if: matrix.target != 'linux'
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK
          fi
          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            unset CSC_KEY_PASSWORD
          fi
          if [ -z "${APPLE_API_KEY:-}" ]; then
            unset APPLE_API_KEY
          fi
          if [ -z "${APPLE_API_KEY_ID:-}" ]; then
            unset APPLE_API_KEY_ID
          fi
          if [ -z "${APPLE_API_ISSUER:-}" ]; then
            unset APPLE_API_ISSUER
          fi
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            unset APPLE_TEAM_ID
          fi
          pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.architecture }} --publish never
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Build Linux installers sequentially
        if: matrix.target == 'linux'
        run: |
          pnpm exec electron-builder --linux snap ${{ matrix.architecture }} --publish never
          pnpm exec electron-builder --linux deb ${{ matrix.architecture }} --publish never
          pnpm exec electron-builder --linux AppImage ${{ matrix.architecture }} --publish never
        env:
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: bearwarden-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes "$(<.github/release-notes-preamble.md)" \
            --generate-notes
