name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS (Universal)
            os: macos-26
            target: mac
            architecture: --x64 --arm64
            artifact_name: bearwarden-macos
            artifact_path: |
              dist/*.dmg
              dist/*.dmg.blockmap
              dist/*.zip
              dist/*.zip.blockmap
              dist/latest-mac.yml
          - platform: Windows
            os: windows-2025
            target: win
            architecture: --x64
            artifact_name: bearwarden-windows
            artifact_path: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - platform: Linux
            os: ubuntu-24.04
            target: linux
            architecture: --x64
            artifact_name: bearwarden-linux
            artifact_path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.snap
              dist/latest-linux.yml

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1

      - name: Install pnpm
        run: npm install --global pnpm@11.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Argon2 in Electron runtime
        run: pnpm run test:electron-argon2

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: pnpm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version

      - name: Build application
        run: pnpm run build
        env:
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Build macOS autofill helper
        if: matrix.target == 'mac'
        run: |
          pnpm run build:native:mac
          helper_app='resources/bin/BearWarden Autofill Helper.app'
          test "$(plutil -extract CFBundleIdentifier raw "$helper_app/Contents/Info.plist")" = 'com.bearwarden.app.autofill-helper'
          plutil -lint "$helper_app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$helper_app"
          "$helper_app/Contents/MacOS/bearwarden-macos-autofill" self-test

      - name: Build ad-hoc signed macOS installers
        if: matrix.target == 'mac'
        run: >-
          pnpm exec electron-builder --mac ${{ matrix.architecture }} --publish never
          --config.mac.identity=-
          --config.mac.entitlements=build/entitlements.mac.adhoc.plist
          --config.mac.entitlementsInherit=build/entitlements.mac.adhoc.plist
          --config.mac.signIgnore='Contents/Helpers/BearWarden Autofill Helper\.app'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Verify macOS application signatures
        if: matrix.target == 'mac'
        shell: bash
        run: |
          found_app=false
          while IFS= read -r -d '' app; do
            found_app=true
            codesign --verify --deep --strict --verbose=2 "$app"
            test "$(codesign -d --verbose=4 "$app" 2>&1 | sed -n 's/^Identifier=//p')" = 'com.bearwarden.app'
            signature_info="$(codesign -d --verbose=4 "$app" 2>&1)"
            grep -q '^Signature=adhoc$' <<< "$signature_info"
            grep -Eq '^CodeDirectory .+\(adhoc,runtime\)' <<< "$signature_info"
            grep -q '^TeamIdentifier=not set$' <<< "$signature_info"
            test "$(codesign -d --entitlements :- "$app" 2>/dev/null | plutil -extract 'com\.apple\.security\.cs\.disable-library-validation' raw -)" = true
            helper_app="$app/Contents/Helpers/BearWarden Autofill Helper.app"
            test "$(codesign -d --verbose=4 "$helper_app" 2>&1 | sed -n 's/^Identifier=//p')" = 'com.bearwarden.app.autofill-helper'
            helper_signature_info="$(codesign -d --verbose=4 "$helper_app" 2>&1)"
            grep -q '^Signature=adhoc$' <<< "$helper_signature_info"
            grep -Eq '^CodeDirectory .+flags=0x2\(adhoc\)' <<< "$helper_signature_info"
            grep -q '^TeamIdentifier=not set$' <<< "$helper_signature_info"
            test -z "$(codesign -d --entitlements :- "$helper_app" 2>/dev/null)"
            "$helper_app/Contents/MacOS/bearwarden-macos-autofill" self-test
          done < <(find dist -type d -name 'BearWarden.app' -print0)
          test "$found_app" = true

      - name: Build unsigned Windows installer
        if: matrix.target == 'win'
        run: pnpm exec electron-builder --win ${{ matrix.architecture }} --publish never --config.win.signExecutable=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Build Linux installers sequentially
        if: matrix.target == 'linux'
        run: |
          pnpm exec electron-builder --linux snap ${{ matrix.architecture }} --publish never
          pnpm exec electron-builder --linux deb ${{ matrix.architecture }} --publish never
          pnpm exec electron-builder --linux AppImage ${{ matrix.architecture }} --publish never
        env:
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: bearwarden-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes "$(<.github/release-notes-preamble.md)" \
            --generate-notes

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh workflow run update-casks.yml \
            --repo gnehs/homebrew-tap \
            --ref main
