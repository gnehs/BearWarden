name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS (Apple Silicon)
            os: macos-26
            target: mac
            architecture: --arm64
            artifact_name: bearwarden-macos-arm64
            artifact_path: dist/*.dmg
          - platform: macOS (Intel)
            os: macos-26-intel
            target: mac
            architecture: --x64
            artifact_name: bearwarden-macos-x64
            artifact_path: dist/*.dmg
          - platform: Windows
            os: windows-2025
            target: win
            architecture: --x64
            artifact_name: bearwarden-windows
            artifact_path: dist/*.exe
          - platform: Linux
            os: ubuntu-24.04
            target: linux
            architecture: --x64
            artifact_name: bearwarden-linux
            artifact_path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.snap

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1

      - name: Install pnpm
        run: npm install --global pnpm@11.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: pnpm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version

      - name: Build application
        run: pnpm run build
        env:
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Build installer
        if: matrix.target != 'linux'
        run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.architecture }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Build Linux installers sequentially
        if: matrix.target == 'linux'
        run: |
          pnpm exec electron-builder --linux AppImage ${{ matrix.architecture }} --publish never
          pnpm exec electron-builder --linux snap ${{ matrix.architecture }} --publish never
          pnpm exec electron-builder --linux deb ${{ matrix.architecture }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --require=./.github/scripts/electron-vite-stdout.cjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: bearwarden-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes "$(<.github/release-notes-preamble.md)" \
            --generate-notes
