shamefullyHoist: true
confirmModulesPurge: false

# electron-builder has not yet refreshed these patched transitive releases.
overrides:
  minimatch@5.1.6: 5.1.9
  minimatch@9.0.5: 9.0.9
  brace-expansion@2.0.1: 2.0.3
  lodash@4.17.21: 4.18.1
  '@xmldom/xmldom@0.8.10': 0.8.13
  tmp@0.2.3: 0.2.7

allowBuilds:
  '@tailwindcss/oxide': true
  # cbor-x has a complete JavaScript fallback; keep its optional native accelerator disabled.
  cbor-extract: false
  # ssh2 and cpu-features only use install scripts for optional native acceleration; the
  # maintained JavaScript parser and AgentProtocol implementation are the required paths.
  cpu-features: false
  electron: true
  electron-winstaller: true
  esbuild: true
  ssh2: false

minimumReleaseAgeExclude:
  - app-builder-lib@26.15.7
  - dmg-builder@26.15.7
  - electron-builder-squirrel-windows@26.15.7
  - electron-builder@26.15.7
  - '@takumi-rs/core-darwin-arm64@2.4.1'
  - '@takumi-rs/core-darwin-x64@2.4.1'
  - '@takumi-rs/core-linux-arm64-gnu@2.4.1'
  - '@takumi-rs/core-linux-arm64-musl@2.4.1'
  - '@takumi-rs/core-linux-x64-gnu@2.4.1'
  - '@takumi-rs/core-linux-x64-musl@2.4.1'
  - '@takumi-rs/core-win32-arm64-msvc@2.4.1'
  - '@takumi-rs/core-win32-x64-msvc@2.4.1'
  - '@takumi-rs/core@2.4.1'
  - '@takumi-rs/helpers@2.4.1'
  - '@takumi-rs/wasm@2.4.1'
  - takumi-js@2.4.1
