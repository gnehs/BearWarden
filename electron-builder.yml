appId: com.bearwarden.app
productName: BearWarden
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - '!resources/bin/**'
asarUnpack:
  - resources/**
win:
  executableName: bearwarden
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/icon.icon
  entitlements: build/entitlements.mac.plist
  extraFiles:
    - from: resources/bin/BearWarden Autofill Helper.app
      to: Helpers/BearWarden Autofill Helper.app
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: BearWarden contributors
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# The packaged app never needs Node CLI entry points; disabling them stops another local
# process from launching the signed binary as a plain Node runtime or attaching a debugger.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish:
  provider: github
  owner: gnehs
  repo: BearWarden
